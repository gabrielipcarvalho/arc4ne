name: web image

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "infra/dns/**"
  workflow_dispatch:

concurrency:
  group: arc4ne-web-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/gabrielipcarvalho/arc4ne-web

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitOps tag bump
      packages: write # GHCR push
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3 # arm64 — the Oracle A1 node
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: GitOps — pin manifest to this image
        run: |
          # rebase-retry (the proven gipc pattern), branch-aware.
          git config user.name  "arc4ne-ci"
          git config user.email "ci@arc4ne.io"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard FETCH_HEAD
            sed -i "s|newTag: .*|newTag: \"${GITHUB_SHA}\"|" infra/k8s/kustomization.yaml
            if git diff --quiet; then echo "already pinned"; exit 0; fi
            git commit -am "deploy: ${GITHUB_SHA:0:7} → arc4ne.io [skip ci]"
            if git push origin HEAD:"$GITHUB_REF_NAME"; then echo "pinned (attempt $attempt)"; exit 0; fi
            echo "push rejected — retrying"
            [ "$attempt" -lt 5 ] && sleep $((attempt * 3))
          done
          echo "::error::failed to pin after 5 attempts"; exit 1
