apiVersion: apps/v1
kind: Deployment
metadata:
  name: arcane-web
  namespace: arcane
  labels: { app: arcane-web }
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: arcane-web }
  template:
    metadata:
      labels: { app: arcane-web }
    spec:
      # Hardened from day one (the gipc web pattern): non-root, read-only rootfs with tmpfs for
      # Next's only runtime writes, drop-ALL, seccomp, no SA token. uid 1001 = Dockerfile's nextjs.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: ghcr.io/gabrielipcarvalho/arc4ne-web:latest # tag pinned by CI via kustomization
          ports:
            - { containerPort: 3000, name: http }
          env:
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: "3000" }
            # open-channel relay (contact form). The Secret is applied by hand (public repo) —
            # see ORGANISATION.md; ArgoCD doesn't manage it, so prune/self-heal never touches it.
            - name: SMTP_HOST
              valueFrom: { secretKeyRef: { name: contact-secrets, key: SMTP_HOST } }
            - name: SMTP_USER
              valueFrom: { secretKeyRef: { name: contact-secrets, key: SMTP_USER } }
            - name: SMTP_PASS
              valueFrom: { secretKeyRef: { name: contact-secrets, key: SMTP_PASS } }
            - name: TURNSTILE_SECRET
              valueFrom: { secretKeyRef: { name: contact-secrets, key: TURNSTILE_SECRET } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: next-cache, mountPath: /app/.next/cache }
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            # 256Mi: headroom for the contact route's in-flight multipart parse + MIME build
            # (8 MiB payload ≈ ~22 MiB transient after base64 + buffers)
            limits: { cpu: 300m, memory: 256Mi }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
